name: GCP Backend MVP Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      - name: Transfer JAR to GCP VM (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "~/app"
          strip_components: 2

      - name: Execute Remote SSH Commands (Run Spring Boot)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            mkdir -p ~/app
          
            CURRENT_PID=$(lsof -t -i:8080)
            if [ -n "$CURRENT_PID" ]; then
              echo "Stopping running app on port 8080 (PID: $CURRENT_PID)..."
              kill -15 $CURRENT_PID
              sleep 3
            fi

            cd ~/app
            JAR_NAME=$(ls -t *.jar | head -n 1)
            nohup java -jar $JAR_NAME > app.log 2>&1 &
            echo "Deployed $JAR_NAME successfully!"